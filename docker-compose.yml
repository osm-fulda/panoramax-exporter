services:
  exporter:
    build: .
    image: ghcr.io/osm-fulda/panoramax-exporter:dev
    ports:
      - "9155:9155"
    environment:
      # Point this at the instance you want to scrape.
      PANORAMAX_API: "https://panoramax.openstreetmap.fr/api"
      REFRESH_INTERVAL: "300"
      PER_USER: "true"
      ADMIN_STATS: "auto"
      # Admin/reviewer bearer token — enables the account, pipeline, content
      # and moderation metrics. Needs Panoramax >= 2.15.1.
      # PANORAMAX_TOKEN: "..."
