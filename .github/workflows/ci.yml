name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
# Supersede in-flight runs for the same ref; a force-push shouldn't leave
# stale jobs consuming runners.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gates:
    uses: ./.github/workflows/quality-gates.yml
