name: Quality gates
on:
  workflow_call:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
      - run: make deps
      - run: make lint
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
      - run: make deps
      - run: make test
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
      - run: make build
  workflows:
    # Lints the workflows themselves: unpinned actions, script injection,
    # bad expressions, invalid schema.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # docker:// refs pin by image digest, not commit SHA.
      - uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667  # v1.7.12
        with:
          args: -color
      # `./…` reusable-workflow refs trip zizmor's low-severity self-repository
      # nudge; the `$/…` alternative it suggests is not worth the portability
      # risk, so gate on medium and above.
      #
      # SARIF upload is off: this is a reusable workflow, so it would need
      # `security-events: write` threaded through every caller (CI, preview,
      # release) just to file findings that already fail the job. Inline
      # annotations give the same signal at `contents: read`.
      - uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99  # v0.6.3
        with:
          min-severity: medium
          advanced-security: false
          annotations: true
