[project]
name = "panoramax-exporter"
version = "0.2.0"
description = "Prometheus exporter for a Panoramax (GeoVisio) instance"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "prometheus_client==0.26.0",
    "requests==2.34.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.5",
]

[project.urls]
Homepage = "https://github.com/osm-fulda/panoramax-exporter"
Issues = "https://github.com/osm-fulda/panoramax-exporter/issues"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "BLE", "C4", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
